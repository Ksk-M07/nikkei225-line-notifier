name: Nikkei225 Perfect Order LINE Notifier

on:
  schedule:
    # 毎営業日 18:00 JST (= 09:00 UTC) に実行
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_MODE: ${{ secrets.LINE_TARGET_MODE }}
          LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
        run: python notify_nikkei.py
