name: Keepalive

on:
  schedule:
    # 毎月1日 00:00 UTC。60日無活動による定期実行の自動停止を防ぐ
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty commit to record repository activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push

      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Nikkei225 Perfect Order LINE Notifier" --repo "$GITHUB_REPOSITORY"
          gh workflow enable "Keepalive" --repo "$GITHUB_REPOSITORY"
